<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>
    Registrá tus servicios - AluConecta
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }


    header {
      background: #1f2937;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }


    header h1 {
      margin: 0 0 10px;
    }


    header p {
      margin: 0;
    }


    .contenedor {
      max-width: 850px;
      margin: 30px auto;
      padding: 20px;
    }


    .tarjeta {
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow:
        0 4px 15px rgba(0,0,0,0.08);

      margin-bottom: 25px;
    }


    .tarjeta h2 {
      margin-top: 0;
    }


    label {
      display: block;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 7px;
    }


    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }


    textarea {
      min-height: 120px;
      resize: vertical;
    }


    .ayuda {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }


    .boton {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 24px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }


    .volver {
      display: block;
      text-align: center;
      margin: 30px 0;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }


    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }

  </style>

</head>


<body>


  <header>

    <h1>
      Registrá tus servicios
    </h1>

    <p>
      Formá parte de la red de profesionales
      de AluConecta.
    </p>

  </header>



  <main class="contenedor">


    <section class="tarjeta">

      <h2>
        Datos del profesional
      </h2>

      <p class="ayuda">
        Completá tus datos para que los clientes
        puedan conocer tus servicios.
      </p>


      <label for="nombre">
        Nombre o empresa
      </label>

      <input
        type="text"
        id="nombre"
        placeholder="Ej.: Juan Pérez - Aberturas JP"
      >


      <label for="localidad">
        Localidad
      </label>

      <select id="localidad">

        <option value="">
          Seleccioná una localidad
        </option>

        <option>
          Rosario
        </option>

        <option>
          Funes
        </option>

        <option>
          Roldán
        </option>

        <option>
          Villa Gobernador Gálvez
        </option>

        <option>
          Otra localidad
        </option>

      </select>


      <label for="zona">
        Zona de trabajo
      </label>

      <input
        type="text"
        id="zona"
        placeholder="Ej.: Rosario y alrededores"
      >


      <label for="especialidad">
        Especialidad principal
      </label>

      <select id="especialidad">

        <option value="">
          Seleccioná una especialidad
        </option>

        <option>
          Ventanas
        </option>

        <option>
          Puertas
        </option>

        <option>
          DVH
        </option>

        <option>
          Cerramientos
        </option>

        <option>
          Aberturas a medida
        </option>

        <option>
          Grandes paños
        </option>

        <option>
          Fabricación e instalación
        </option>

      </select>


      <label for="servicios">
        Servicios que ofrecés
      </label>

      <textarea
        id="servicios"
        placeholder="Contanos qué trabajos realizás..."
      ></textarea>


      <label for="experiencia">
        Experiencia
      </label>

      <textarea
        id="experiencia"
        placeholder="Contanos brevemente tu experiencia..."
      ></textarea>


      <label for="descripcion">
        Presentación profesional
      </label>

      <textarea
        id="descripcion"
        placeholder="Presentate y contales a los clientes por qué deberían elegir tus servicios..."
      ></textarea>


      <button
        type="button"
        class="boton"
        onclick="registrarProfesional()">

        Registrarme en AluConecta

      </button>

    </section>



    <section
      id="mensaje"
      class="tarjeta"
      style="display:none;">

    </section>



    <a
      href="aluminio.html"
      class="volver">

      ← Volver a Carpintería de aluminio

    </a>


  </main>



  <footer>

    <p>
      © 2026 AluConecta
    </p>

    <p>
      Conectando personas, trabajos y oportunidades.
    </p>

  </footer>



  <script>

    function registrarProfesional() {


      const nombre =
        document
          .getElementById("nombre")
          .value
          .trim();


      const localidad =
        document
          .getElementById("localidad")
          .value;


      const especialidad =
        document
          .getElementById("especialidad")
          .value;


      const mensaje =
        document
          .getElementById("mensaje");



      if (
        nombre === "" ||
        localidad === "" ||
        especialidad === ""
      ) {

        mensaje.style.display = "block";

        mensaje.innerHTML = `

          <h2>
            Completá los datos principales
          </h2>

          <p>
            Necesitamos tu nombre o empresa,
            localidad y especialidad para
            continuar.
          </p>

        `;

        return;
      }



      mensaje.style.display = "block";

      mensaje.innerHTML = `

        <h2>
          ¡Gracias por registrarte!
        </h2>

        <p>
          Recibimos los datos de:
          <strong>${nombre}</strong>
        </p>

        <p>
          📍 ${localidad}
        </p>

        <p>
          🪟 ${especialidad}
        </p>

        <p>
          Tu perfil será incorporado a la red
          de profesionales de AluConecta.
        </p>

        <p class="ayuda">
          Esta versión es una demostración.
          Más adelante conectaremos este formulario
          con un sistema real de registro y perfiles.
        </p>

      `;

      mensaje.scrollIntoView({
        behavior: "smooth"
      });

    }

  </script>


</body>

</html>
