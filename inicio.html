<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inicio - AluConecta</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 16px 20px;
    }

    .barra {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .menu {
      position: relative;
    }

    .menu-boton {
      border: none;
      background: transparent;
      color: white;
      font-size: 28px;
      cursor: pointer;
      padding: 5px 8px;
    }

    .menu-opciones {
      display: none;
      position: absolute;
      right: 0;
      top: 45px;
      width: 220px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      overflow: hidden;
      z-index: 10;
    }

    .menu-opciones a,
    .menu-opciones button {
      display: block;
      width: 100%;
      padding: 14px 16px;
      border: none;
      background: white;
      color: #222;
      text-align: left;
      text-decoration: none;
      font-size: 15px;
      cursor: pointer;
    }

    .menu-opciones a:hover,
    .menu-opciones button:hover {
      background: #f1f5f9;
    }

    .menu-opciones.mostrar {
      display: block;
    }

    .contenedor {
      max-width: 1100px;
      margin: 35px auto;
      padding: 20px;
    }

    .bienvenida {
      background: white;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
      margin-bottom: 25px;
    }

    .bienvenida h1 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 30px;
    }

    .bienvenida p {
      color: #555;
      line-height: 1.5;
      margin-bottom: 0;
    }

    .busqueda {
      margin-top: 25px;
      display: flex;
      gap: 10px;
    }

    .busqueda input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .boton-buscar {
      border: none;
      border-radius: 8px;
      padding: 14px 22px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .titulo {
      margin: 30px 0 15px;
    }

    .tarjetas {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .tarjeta {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .tarjeta h2 {
      margin-top: 0;
    }

    .tarjeta p {
      color: #666;
      line-height: 1.5;
    }

    .boton {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 18px;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .boton-secundario {
      background: #16a34a;
    }
