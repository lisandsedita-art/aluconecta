<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AluConecta — Crear cuenta</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#eef2f7;color:#0f2e4a}.top{background:#0f2e4a;color:#fff;padding:20px}.card{max-width:430px;margin:30px auto;background:#fff;border-radius:24px;padding:28px;box-shadow:0 16px 40px #0f2e4a22}label{display:block;font-size:11px;font-weight:800;margin:15px 0 7px}.input,.select{width:100%;height:50px;border:1px solid #e6eaf0;border-radius:13px;padding:0 12px;box-sizing:border-box;font-size:15px}.button{width:100%;height:54px;border:0;border-radius:15px;background:#fbcf3d;color:#0f2e4a;font-weight:800;margin-top:20px}.error{color:#d33;font-size:11px;margin-top:5px}.hidden{display:none}.notice{padding:12px;border-radius:12px;background:#f7f9fb;font-size:12px;margin:15px 0}</style></head><body><header class="top"><b>Alu<span style="color:#7ab8e6">Conecta</span></b><h1 style="font-size:28px;margin:28px 0 8px">Publicar Obra - <span style="color:#fbcf3d">Crear cuenta</span></h1><p style="color:#9db0c0">Registrate para publicar tu obra y conectar con carpinteros de aluminio.</p></header><main class="card"><div id="msg" class="notice hidden"></div><div id="form"><label>NOMBRE Y APELLIDO</label><input id="nombre" class="input" autocomplete="name"><label>ROL EN LA OBRA</label><select id="rol" class="select"><option value="">Seleccioná tu rol</option><option>Propietario</option><option>Arquitecto</option><option>Ingeniero</option><option>Constructor</option><option>Desarrollador</option><option>Empresa constructora</option><option>MMO</option><option>Otro</option></select><label>WHATSAPP</label><input id="wa" class="input" inputmode="numeric" autocomplete="tel"><label>EMAIL</label><input id="email" class="input" type="email" autocomplete="email"><label>DNI</label><input id="dni" class="input" inputmode="numeric" maxlength="8"><label>PROVINCIA</label><select id="prov" class="select"></select><label>LOCALIDAD / ZONA</label><input id="loc" class="input" autocomplete="address-level2"><button id="send" class="button">ENVIAR ENLACE DE VERIFICACIÓN</button></div><div id="emailView" class="hidden"><h2>Revisá tu email</h2><p id="emailText"></p><button id="again" class="button">REENVIAR ENLACE</button></div></main><script>
const URL='https://wroaxwjyjrxzwctfkyoo.supabase.co',KEY='sb_publishable_35152HM4RtYst1yA2a79zA_zIh6yDs3',sb=supabase.createClient(URL,KEY),P='aluconecta_cliente_pending',$=x=>document.getElementById(x);
['Buenos Aires','CABA','Catamarca','Chaco','Chubut','Córdoba','Corrientes','Entre Ríos','Formosa','Jujuy','La Pampa','La Rioja','Mendoza','Misiones','Neuquén','Río Negro','Salta','San Juan','San Luis','Santa Cruz','Santa Fe','Santiago del Estero','Tierra del Fuego','Tucumán'].forEach(x=>{$('prov').add(new Option(x,x))});
function get(){return{nombre:$('nombre').value.trim(),rol:$('rol').value,whatsapp:$('wa').value.replace(/\D/g,''),email:$('email').value.trim().toLowerCase(),dni:$('dni').value.replace(/\D/g,''),provincia:$('prov').value,localidad:$('loc').value.trim()}}
function valid(d){if(d.nombre.length<5||!d.rol||!/^[0-9]{10}$/.test(d.whatsapp)||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)||!/^[0-9]{7,8}$/.test(d.dni)||!d.provincia||d.localidad.length<3){$('msg').textContent='Completá correctamente todos los datos requeridos.';$('msg').className='notice';$('msg').classList.remove('hidden');return false}return true}
async function send(){const d=get();if(!valid(d))return;sessionStorage.setItem(P,JSON.stringify(d));$('send').disabled=true;const r=await sb.auth.signInWithOtp({email:d.email,options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname}});$('send').disabled=false;if(r.error){$('msg').textContent='No pudimos enviar el enlace: '+r.error.message;$('msg').className='notice';$('msg').classList.remove('hidden');return}$('form').classList.add('hidden');$('emailView').classList.remove('hidden');$('emailText').textContent='Enviamos un enlace seguro a '+d.email+'. Abrilo para verificar tu cuenta.'}
async function finish(){const raw=sessionStorage.getItem(P);if(!raw)return;const d=JSON.parse(raw),u=await sb.auth.getUser();if(!u.data.user)return;const profile={id:u.data.user.id,nombre:d.nombre,tipo_usuario:'cliente_profesional',actividades:d.rol,localidad:d.localidad,telefono:d.whatsapp};const r=await sb.from('perfiles').upsert(profile,{onConflict:'id'});if(!r.error){sessionStorage.removeItem(P);location.href='index.html'}else{console.error(r.error);$('msg').textContent='La cuenta fue verificada, pero no pudimos guardar el perfil. Revisaremos este punto con Supabase.';$('msg').className='notice';$('msg').classList.remove('hidden')}}
$('send').onclick=send;$('again').onclick=async()=>{const d=JSON.parse(sessionStorage.getItem(P)||'{}');if(d.email)await sb.auth.signInWithOtp({email:d.email,options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname}})};finish();
</script></body></html>
