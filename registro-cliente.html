<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2e4d">
<link rel="manifest" href="manifest.json">
<title>Publicar obra - AluConecta</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif;box-sizing:border-box;margin:0;padding:0}
body{background:#f8fbfd;color:#0f2e4d;-webkit-font-smoothing:antialiased}
.header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #eee;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.stepper{display:flex;gap:8px;padding:20px}
.dot{height:8px;flex:1;background:#e5eaf0;border-radius:999px}
.dot.active{background:#0f2e4d}
.card{background:#fff;border-radius:20px;padding:20px;margin:16px 20px;border:1px solid #eee}
input,textarea,select{width:100%;height:52px;border-radius:12px;border:1px solid #ddd;padding:0 16px;margin-top:8px;font-size:16px}
textarea{height:100px;padding:12px 16px}
.btn{height:56px;border-radius:999px;display:grid;place-items:center;font-weight:800;width:100%;border:0;font-size:16px}
.btn-dark{background:#0f2e4d;color:#fff}
.btn-orange{background:#f5a623;color:#0f2e4d}
.progress{font-size:12px;letter-spacing:.1em;opacity:.5;font-weight:700}
.hidden{display:none}
</style>
</head>
<body>
<div class="header"><a href="index.html" style="font-weight:900;text-decoration:none;color:#0f2e4d">← Alu<span style="color:#5cc8e8">Conecta</span></a><span class="progress" id="prog">PASO 1 DE 3</span></div>

<div class="stepper"><div class="dot active" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div>

<!-- PASO 1 -->
<div id="s1" class="card">
<h2 style="font-size:24px;font-weight:900">¿Qué necesitás?</h2>
<p style="opacity:.6;margin-top:8px;font-size:14px">Pensado para completar con una mano en obra.</p>
<label style="margin-top:20px;display:block;font-weight:700;font-size:13px">TIPO DE OBRA</label>
<select id="tipo"><option>Casa nueva - Aberturas completas</option><option>Ampliación</option><option>Cambio de aberturas</option><option>Local / Oficina</option></select>
<label style="margin-top:16px;display:block;font-weight:700;font-size:13px">CANTIDAD APROX</label>
<input id="cant" type="number" placeholder="Ej: 12 aberturas" inputmode="numeric">
<button class="btn btn-dark" style="margin-top:24px" onclick="go(2)">Siguiente →</button>
</div>

<!-- PASO 2 -->
<div id="s2" class="card hidden">
<h2 style="font-size:24px;font-weight:900">Medidas y foto</h2>
<p style="opacity:.6;margin-top:8px;font-size:14px">Si no tenés medidas exactas, sacá una foto del hueco.</p>
<label style="margin-top:20px;display:block;font-weight:700;font-size:13px">MEDIDAS (opcional)</label>
<textarea id="med" placeholder="Ej: 2 ventanas 1.50x1.10, 1 puerta 2.00x0.90"></textarea>
<label style="margin-top:16px;display:block;font-weight:700;font-size:13px">FOTO DE LA OBRA</label>
<input type="file" accept="image/*" capture="environment" style="padding:14px">
<div style="display:flex;gap:12px;margin-top:24px">
<button class="btn" style="background:#f1f4f8;color:#0f2e4d;flex:1" onclick="go(1)">← Atrás</button>
<button class="btn btn-dark" style="flex:1.5" onclick="go(3)">Siguiente →</button>
</div>
</div>

<!-- PASO 3 -->
<div id="s3" class="card hidden">
<h2 style="font-size:24px;font-weight:900">¿Dónde te contactamos?</h2>
<p style="opacity:.6;margin-top:8px;font-size:14px">Te llegan 3 presupuestos comparables por WhatsApp.</p>
<label style="margin-top:20px;display:block;font-weight:700;font-size:13px">WHATSAPP</label>
<input id="wpp" type="tel" placeholder="341 5..." inputmode="tel">
<label style="margin-top:16px;display:block;font-weight:700;font-size:13px">LOCALIDAD</label>
<input id="loc" value="Capitán Bermúdez" placeholder="Localidad">
<button class="btn btn-orange" style="margin-top:24px" onclick="enviar()">Publicar obra gratis 🚀</button>
<p style="text-align:center;font-size:12px;opacity:.5;margin-top:12px">Sin spam. Solo carpinteros verificados.</p>
</div>

<script>
function go(n){
 document.getElementById('s1').classList.add('hidden');
 document.getElementById('s2').classList.add('hidden');
 document.getElementById('s3').classList.add('hidden');
 document.getElementById('s'+n).classList.remove('hidden');
 document.getElementById('prog').innerText='PASO '+n+' DE 3';
 document.getElementById('d1').classList.toggle('active',n>=1);
 document.getElementById('d2').classList.toggle('active',n>=2);
 document.getElementById('d3').classList.toggle('active',n>=3);
 window.scrollTo(0,0);
}
function enviar(){
 let t=document.getElementById('tipo').value;
 let c=document.getElementById('cant').value;
 let m=document.getElementById('med').value;
 let w=document.getElementById('wpp').value;
 let l=document.getElementById('loc').value;
 let msg = `Hola AluConecta! Quiero publicar: ${t} - ${c} aberturas - Medidas: ${m} - Localidad: ${l} - Mi WPP: ${w}`;
 window.location.href='https://wa.me/543416000000?text='+encodeURIComponent(msg);
}
if('serviceWorker' in navigator){ /* futuro PWA */ }
</script>
</body>
</html>
