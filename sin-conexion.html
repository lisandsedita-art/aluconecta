<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2e4d">
  <meta name="robots" content="noindex,nofollow">
  <title>Sin conexión · AluConecta</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0f2e4d; color: #fff; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(100%, 440px); text-align: center; }
    img { width: 72px; height: 72px; object-fit: contain; margin-bottom: 12px; }
    h1 { font-size: clamp(28px, 7vw, 36px); line-height: 1.15; margin: 10px 0 16px; }
    p { color: #d5e4f1; margin: 0 auto 28px; max-width: 370px; }
    button { border: none; border-radius: 999px; background: #ffd54f; color: #0f2e4d; padding: 15px 30px; font: 800 16px system-ui, sans-serif; cursor: pointer; min-height: 48px; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    small { display: block; margin-top: 30px; color: #b5c8d7; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" width="72" height="72">
    <h1>Sin conexión</h1>
    <p>Para consultar proyectos, enviar cotizaciones o administrar tu cuenta, conectate a Internet e intentá nuevamente.</p>
    <button type="button" onclick="location.reload()">Volver a intentar</button>
    <small>AluConecta · Donde los proyectos encuentran sus aberturas.</small>
  </main>
</body>
</html>
