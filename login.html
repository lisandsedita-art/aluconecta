<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Ingresar - AluConecta</title> <style> * { box-sizing: border-box; } body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; color: #222; } header { background: #1f2937; color: white; text-align: center; padding: 30px 20px; } header h1 { margin: 0 0 10px; } header p { margin: 0; } .contenedor { max-width: 500px; margin: 40px auto; padding: 20px; } .tarjeta { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); } h2 { text-align: center; margin-top: 0; } .campo { margin-bottom: 20px; } label { display: block; margin-bottom: 7px; font-weight: bold; } input { width: 100%; padding: 13px; border: 1px solid #ccc; border-radius: 7px; font-size: 16px; } input:focus { outline: none; border-color: #2563eb; } .boton { width: 100%; padding: 14px; border: none; border-radius: 7px; background: #2563eb; color: white; font-size: 17px; font-weight: bold; cursor: pointer; } .boton:disabled { opacity: 0.6; cursor: wait; } .mensaje { display: none; margin-top: 20px; padding: 15px; border-radius: 8px; text-align: center; } .mensaje.error { display: block; background: #fee2e2; color: #991b1b; } .mensaje.exito { display: block; background: #dcfce7; color: #166534; } .enlace { display: block; text-align: center; margin-top: 20px; color: #2563eb; text-decoration: none; font-weight: bold; } .registro { text-align: center; margin-top: 25px; color: #555; } footer { text-align: center; padding: 25px; color: #666; } </style> </head> <body> <header> <h1>AluConecta</h1> <p>Personas, profesionales y empresas conectadas.</p> </header> <main class="contenedor"> <section class="tarjeta"> <h2>Ingresar</h2> <p style="text-align:center;"> Ingresá a tu cuenta de AluConecta. </p> <form id="formularioLogin"> <div class="campo"> <label for="email"> Correo electrónico </label> <input type="email" id="email" placeho r ); mensaje.className = "mensaje error"; mensaje.style.display = "block"; mensaje.innerHTML = ` <strong> No pudimos iniciar sesión. </strong> <p> ${error.message} </p> <p> Revisá tu correo y contraseña. </p> `; } finally { boton.disabled = false; boton.textContent = "Ingresar"; } } ); </script> </body> </html>
