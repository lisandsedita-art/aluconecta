<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Confirmando cuenta - AluConecta</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --azul: #0f2e4d;
      --celeste: #5bc0de;
      --amarillo: #f5c542;
      --amarillo-hover: #e5b632;
      --fondo: #f4f6f8;
      --texto: #24313d;
      --suave: #64748b;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family:
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Arial,
        sans-serif;
      background: var(--fondo);
      color: var(--texto);
    }

    header {
      background: var(--azul);
      padding: 25px 20px 60px;
      text-align: center;
    }

    .marca {
      color: white;
      font-size: 21px;
      font-weight: 800;
    }

    .marca span {
      color: var(--celeste);
    }

    main {
      width: calc(100% - 32px);
      max-width: 520px;
      flex: 1;
      margin: -30px auto 40px;
      position: relative;
    }

    .tarjeta {
      min-height: 300px;
      padding: 36px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: white;
      border: 1px solid rgba(15,46,77,.07);
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(15,46,77,.09);
      text-align: center;
    }

    .estado-icono {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
    }

    .estado-icono svg {
      width: 31px;
      height: 31px;
    }

    .estado-icono.cargando {
      background: #edf8fb;
      color: var(--azul);
    }

    .estado-icono.exito {
      background: #dcfce7;
      color: #166534;
    }

    .estado-icono.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .spinner {
      width: 29px;
      height: 29px;
      border: 3px solid #cdebf3;
      border-top-color: var(--azul);
      border-radius: 50%;
      animation: girar .8s linear infinite;
    }

    @keyframes girar {
      to {
        transform: rotate(360deg);
      }
    }

    h1 {
      margin: 0 0 10px;
      color: var(--azul);
      font-size: 25px;
      line-height: 1.25;
    }

    .descripcion {
      max-width: 390px;
      margin: 0 auto;
      color: var(--suave);
      font-size: 14px;
      line-height: 1.6;
    }

    .boton {
      display: inline-flex;
      min-height: 50px;
      margin-top: 24px;
      padding: 12px 22px;
      align-items: center;
      justify-content: center;
      border-radius: 11px;
      background: var(--amarillo);
      color: var(--azul);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }

    .boton:hover {
      background: var(--amarillo-hover);
    }

    .detalle-error {
      margin: 18px 0 0;
      padding: 13px;
      border-radius: 11px;
      background: #fff5f5;
      color: #991b1b;
      font-size: 13px;
      line-height: 1.5;
    }

    footer {
      padding: 26px 20px;
      background: var(--azul);
      color: #c8d5e1;
      text-align: center;
      font-size: 13px;
      line-height: 1.7;
    }

    @media (max-width: 560px) {
      header {
        padding: 23px 18px 54px;
      }

      main {
        width: calc(100% - 24px);
      }

      .tarjeta {
        min-height: 280px;
        padding: 31px 21px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>


<body>

<header>

  <div class="marca">
    Alu<span>Conecta</span>
  </div>

</header>


<main>

  <section class="tarjeta">

    <div id="contenido" aria-live="polite" aria-busy="true">

      <div class="estado-icono cargando">
        <div
          class="spinner"
          aria-label="Verificando cuenta"
        ></div>
      </div>

      <h1>
        Estamos verificando tu cuenta
      </h1>

      <p class="descripcion">
        Esperá unos segundos mientras comprobamos
        el acceso a tu cuenta.
      </p>

    </div>

  </section>

</main>


<footer>
  © 2026 AluConecta
  <br>
  Donde los proyectos encuentran sus aberturas.
</footer>


<noscript>
  <p>Activá JavaScript para comprobar tu cuenta y después
    <a href="ingresar.html">iniciá sesión</a>.</p>
</noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script>
'use strict';
const contenido = document.getElementById('contenido');

function mostrarEstado(titulo, texto, etiqueta, destino, exito = false) {
  contenido.replaceChildren();
  contenido.setAttribute('aria-busy', 'false');
  const icono = document.createElement('div');
  icono.className = 'estado-icono ' + (exito ? 'exito' : 'cargando');
  icono.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/>' +
    (exito ? '<path d="m8 12 2.7 2.7L16.5 9"/>' : '<path d="M12 11v6M12 7h.01"/>') + '</svg>';
  const encabezado = document.createElement('h1');
  encabezado.textContent = titulo;
  const descripcion = document.createElement('p');
  descripcion.className = 'descripcion';
  descripcion.textContent = texto;
  const enlace = document.createElement('a');
  enlace.className = 'boton';
  enlace.href = destino;
  enlace.textContent = etiqueta;
  contenido.append(icono, encabezado, descripcion, enlace);
  const regreso = document.createElement('p');
  const inicio = document.createElement('a');
  inicio.href = 'index.html';
  inicio.textContent = 'Volver al inicio';
  regreso.append(inicio);
  contenido.append(regreso);
}

function pedirIngreso() {
  mostrarEstado(
    'Ingresá para continuar',
    'No encontramos una sesión activa en este navegador. Ingresá con el correo y la contraseña que elegiste para comprobar tu cuenta. No hace falta registrarte nuevamente.',
    'INICIAR SESIÓN', 'ingresar.html'
  );
}

function conLimite(promesa) {
  let temporizador;
  return Promise.race([
    promesa,
    new Promise((_, rechazar) => {
      temporizador = setTimeout(() => rechazar(new Error('tiempo-agotado')), 12000);
    })
  ]).finally(() => clearTimeout(temporizador));
}

async function confirmarCuenta() {
  try {
    if (!window.supabase) throw new Error('servicio-no-disponible');
    const sb = window.supabase.createClient(
      'https://wroaxwjyjrxzwctfkyoo.supabase.co',
      'sb_publishable_35152HM4RtYst1yA2a79zA_zIh6yDs3'
    );
    // El SDK procesa el enlace antes de resolver getSession.
    const sesion = await conLimite(sb.auth.getSession());
    // Quitar credenciales del enlace solo después de procesarlo.
    if (location.hash || location.search) {
      history.replaceState(null, '', location.pathname);
    }
    if (sesion.error || !sesion.data?.session) {
      pedirIngreso();
      return;
    }
    const resultado = await conLimite(sb.auth.getUser());
    if (resultado.error || !resultado.data?.user) {
      if (!resultado.error || resultado.error.status === 401 || resultado.error.status === 403) {
        pedirIngreso();
        return;
      }
      throw resultado.error;
    }
    const usuario = resultado.data.user;
    if (!usuario.email_confirmed_at) {
      mostrarEstado('Confirmá tu correo',
        'Todavía no pudimos verificar tu correo. Revisá el mensaje de confirmación que recibiste. Si necesitás ayuda, escribinos a hola@aluconecta.com.ar.',
        'IR A INICIAR SESIÓN', 'ingresar.html');
      return;
    }
    // El perfil se crea en la base al registrarse. Esta página no lo sobrescribe.
    const consulta = await conLimite(sb.from('perfiles')
      .select('id,tipo_usuario').eq('id', usuario.id).maybeSingle());
    if (consulta.error) throw consulta.error;
    const tipo = consulta.data?.tipo_usuario;
    const profesional = ['cliente_profesional', 'profesional', 'empresa', 'cliente'].includes(tipo);
    if (tipo !== 'carpintero' && !profesional) {
      mostrarEstado('Tu perfil necesita revisión',
        'Tu correo está confirmado, pero el perfil no tiene un tipo de cuenta válido. Escribinos a hola@aluconecta.com.ar para completar el acceso. No hace falta crear otra cuenta.',
        'CONTACTAR SOPORTE', 'mailto:hola@aluconecta.com.ar');
      return;
    }
    mostrarEstado('Tu cuenta está lista',
      'Tu correo está confirmado y tu perfil está disponible. Ya podés acceder a tu espacio de trabajo.',
      'IR A MI PANEL', tipo === 'carpintero' ? 'panel-carpintero.html' : 'panel-cliente.html', true);
  } catch (_) {
    mostrarEstado('No pudimos comprobar tu cuenta',
      'No pudimos consultar el estado de tu cuenta en este momento. Revisá tu conexión y reintentá. No hace falta registrarte nuevamente.',
      'REINTENTAR', 'confirmacion.html');
  }
}
confirmarCuenta();
</script>
</body>
</html>
