<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Confirmando cuenta - AluConecta</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Arial;
      background: #eef2f7;
      color: #0f2e4a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contenedor {
      width: 100%;
      max-width: 500px;
      padding: 20px;
    }

    .tarjeta {
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow:
        0 16px 40px #0f2e4a22;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #0f2e4a;
    }

    .mensaje {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
    }

    .cargando {
      background: #eef2ff;
      color: #3730a3;
    }

    .exito {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .boton {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 22px;
      border-radius: 12px;
      background: #fbcf3d;
      color: #0f2e4a;
      text-decoration: none;
      font-weight: 800;
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <section class="tarjeta">

      <h1>
        Alu<span style="color:#7ab8e6">
          Conecta
        </span>
      </h1>

      <div
        id="mensaje"
        class="mensaje cargando"
      >
        Verificando tu cuenta y creando tu perfil...
      </div>

    </section>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <script>

    const SUPABASE_URL =
      'https://wroaxwjyjrxzwctfkyoo.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_35152HM4RtYst1yA2a79zA_zIh6yDs3';


    const sb =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const mensaje =
      document.getElementById(
        'mensaje'
      );


    function showError(text) {

      mensaje.className =
        'mensaje error';

      mensaje.innerHTML = `
        <h2>No pudimos completar el registro</h2>

        <p>${escapeHtml(text)}</p>

        <a
          href="registro-cliente.html"
          class="boton"
        >
          Volver al registro
        </a>
      `;

    }


    function escapeHtml(value) {

      const div =
        document.createElement('div');

      div.textContent =
        String(value || '');

      return div.innerHTML;

    }


    async function confirmarCuenta() {

      try {

        /*
         * Supabase JS procesa automáticamente
         * los datos de autenticación presentes
         * en la URL y recupera la sesión.
         */

        const {
          data,
          error
        } =
          await sb.auth.getSession();


        if (error) {
          throw error;
        }


        if (
          !data.session ||
          !data.session.user
        ) {

          throw new Error(
            'No encontramos una sesión válida. El enlace puede haber vencido o ya haber sido utilizado.'
          );

        }


        const user =
          data.session.user;


        const metadata =
          user.user_metadata || {};


        /*
         * Confirmamos que este usuario viene
         * del registro de cliente.
         */

        if (
          metadata.tipo_usuario !==
          'cliente_profesional'
        ) {

          throw new Error(
            'No encontramos los datos necesarios para completar este registro.'
          );

        }


        if (
          !metadata.nombre ||
          !metadata.rol ||
          !metadata.whatsapp ||
          !metadata.dni ||
          !metadata.provincia ||
          !metadata.localidad
        ) {

          throw new Error(
            'El registro está incompleto. Volvé al formulario para completar tus datos.'
          );

        }


        const profile = {

          id:
            user.id,

          nombre:
            metadata.nombre,

          tipo_usuario:
            'cliente_profesional',

          actividades:
            metadata.rol,

          localidad:
            metadata.localidad,

          telefono:
            metadata.whatsapp,

          dni:
            metadata.dni,

          provincia:
            metadata.provincia

        };


        const {
          error: profileError
        } =
          await sb
            .from('perfiles')
            .upsert(
              profile,
              {
                onConflict: 'id'
              }
            );


        if (profileError) {
          throw profileError;
        }


        mensaje.className =
          'mensaje exito';


        mensaje.innerHTML = `
          <h2>
            ¡Perfil creado correctamente!
          </h2>

          <p>
            Tu correo fue verificado y
            tu perfil quedó registrado en AluConecta.
          </p>

          <a
            href="ingresar.html"
            class="boton"
          >
            CONTINUAR
          </a>
        `;


      } catch (error) {

        console.error(
          'Error al completar el registro:',
          error
        );


        showError(
          error.message ||
          'Ocurrió un error inesperado.'
        );

      }

    }


    confirmarCuenta();

  </script>

</body>
</html>
