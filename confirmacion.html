<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Confirmando cuenta - AluConecta</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contenedor {
      width: 100%;
      max-width: 500px;
      padding: 20px;
    }

    .tarjeta {
      background: white;
      padding: 35px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    .mensaje {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
    }

    .cargando {
      background: #eef2ff;
      color: #3730a3;
    }

    .exito {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .boton {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 22px;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <section class="tarjeta">

      <h1>AluConecta</h1>

      <div
        id="mensaje"
        class="mensaje cargando">

        Confirmando tu cuenta...

      </div>

    </section>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://wroaxwjyjrxzwctfkyoo.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_35152HM4RtYst1yA2a79zA_zIh6yDs3";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function confirmarCuenta() {

      const mensaje =
        document.getElementById("mensaje");


      try {

        /*
         * Supabase procesa el enlace de confirmación
         * y establece la sesión correspondiente.
         */

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();


        if (error) {

          throw error;

        }


        if (data.session) {

          mensaje.className =
            "mensaje exito";

          mensaje.innerHTML = `

            <h2>
              ¡Cuenta confirmada!
            </h2>

            <p>
              Tu correo electrónico fue confirmado
              correctamente.
            </p>

            <p>
              Ahora podés ingresar a AluConecta.
            </p>

            <a
              href="login.html"
              class="boton">

              Ingresar a AluConecta

            </a>

          `;

        } else {

          mensaje.className =
            "mensaje error";

          mensaje.innerHTML = `

            <h2>
              No pudimos confirmar la cuenta
            </h2>

            <p>
              El enlace puede haber vencido
              o ya haber sido utilizado.
            </p>

            <a
              href="index.html"
              class="boton">

              Volver a AluConecta

            </a>

          `;

        }


      } catch (error) {

        console.error(
          "Error al confirmar cuenta:",
          error
        );


        mensaje.className =
          "mensaje error";

        mensaje.innerHTML = `

          <h2>
            Ocurrió un problema
          </h2>

          <p>
            ${error.message}
          </p>

          <a
            href="index.html"
            class="boton">

            Volver a AluConecta

          </a>

        `;

      }

    }


    confirmarCuenta();

  </script>

</body>

</html>
