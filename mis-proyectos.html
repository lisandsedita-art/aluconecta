<script>


const sb =
  window.supabase.createClient(
    "https://wroaxwjyjrxzwctfkyoo.supabase.co",
    "sb_publishable_35152HM4RtYst1yA2a79zA_zIh6yDs3"
  );


let user =
  null;


let carpinteriasPorId =
  new Map();


const lista =
  document.getElementById(
    "lista"
  );


const resumen =
  document.getElementById(
    "resumen"
  );


const mensaje =
  document.getElementById(
    "mensaje"
  );



function fecha(valor) {

  if (!valor) {
    return "";
  }


  const d =
    new Date(valor);


  if (
    Number.isNaN(
      d.getTime()
    )
  ) {
    return "";
  }


  return new Intl.DateTimeFormat(
    "es-AR",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }
  ).format(d);

}



function mostrarMensaje(
  texto,
  tipo
) {

  mensaje.className =
    "msg " + tipo;


  mensaje.textContent =
    texto;

}



function esRolProfesional(
  tipo
) {

  return [
    "cliente_profesional",
    "profesional",
    "empresa",
    "cliente"
  ].includes(
    tipo
  );

}



function normalizarUrlRed(
  valor,
  base
) {

  const texto =
    String(valor || "")
      .trim();


  if (!texto) {
    return "";
  }


  if (
    /^https?:\/\//i.test(texto)
  ) {

    try {

      const url =
        new URL(texto);


      if (
        url.protocol === "http:" ||
        url.protocol === "https:"
      ) {

        return url.href;

      }

    } catch {

      return "";

    }

  }


  if (!base) {

    try {

      const url =
        new URL(
          "https://" +
          texto.replace(/^\/+/, "")
        );


      return url.href;

    } catch {

      return "";

    }

  }


  const usuario =
    texto
      .replace(/^@/, "")
      .replace(/^\/+/, "")
      .replace(
        /[^a-zA-Z0-9._-]/g,
        ""
      );


  if (!usuario) {
    return "";
  }


  return base + usuario;

}



async function cargarCarpinteriasVisibles() {


  const {
    data,
    error
  } =
    await sb.rpc(
      "buscar_carpinteros_visibles"
    );


  if (error) {
    throw error;
  }


  const perfiles =
    Array.isArray(data)
      ? data
      : [];


  carpinteriasPorId =
    new Map();


  perfiles.forEach(
    function(perfil) {

      carpinteriasPorId.set(
        String(perfil.id),
        perfil
      );

    }
  );

}



function obtenerCarpinteria(
  id
) {

  return (
    carpinteriasPorId.get(
      String(id)
    ) || null
  );

}



async function actualizarEstado(
  interesId,
  nuevoEstado
) {


  const {
    error
  } =
    await sb

      .from(
        "intereses_proyectos"
      )

      .update({
        estado:
          nuevoEstado
      })

      .eq(
        "id",
        interesId
      );


  if (error) {

    mostrarMensaje(
      "No pudimos actualizar la autorización: " +
      error.message,
      "error"
    );

    return;

  }


  mostrarMensaje(
    nuevoEstado ===
    "autorizado"

      ? "Carpintería autorizada correctamente."

      : "Carpintería marcada como no autorizada.",

    "ok"
  );


  await cargarProyectos();

}



async function cargarContactoCarpintero(
  proyectoId,
  carpinteroId,
  contenedor
) {


  try {


    const {
      data,
      error
    } =
      await sb.rpc(
        "contacto_carpintero_autorizado",
        {
          p_proyecto_id:
            proyectoId,

          p_carpintero_id:
            carpinteroId
        }
      );


    if (error) {
      throw error;
    }


    const perfil =
      Array.isArray(data)
        ? data[0]
        : null;


    contenedor.innerHTML =
      "";


    if (!perfil) {


      const aviso =
        document.createElement(
          "div"
        );


      aviso.className =
        "info";


      aviso.textContent =
        "Los datos de contacto todavía no están disponibles.";


      contenedor.appendChild(
        aviso
      );


      return;

    }



    const titulo =
      document.createElement(
        "strong"
      );


    titulo.textContent =
      "CONTACTO HABILITADO";


    contenedor.appendChild(
      titulo
    );



    if (
      perfil.nombre
    ) {


      const nombre =
        document.createElement(
          "div"
        );


      nombre.className =
        "info";


      nombre.style.marginTop =
        "7px";


      nombre.textContent =
        perfil.nombre;


      contenedor.appendChild(
        nombre
      );

    }



    if (
      perfil.telefono
    ) {


      const numero =
        String(
          perfil.telefono
        )
          .replace(/\D/g, "");


      const boton =
        document.createElement(
          "a"
        );


      boton.href =
        "https://wa.me/54" +
        numero;


      boton.target =
        "_blank";


      boton.rel =
        "noopener noreferrer";


      boton.textContent =
        "WHATSAPP / CONTACTAR";


      boton.className =
        "whatsapp";


      contenedor.appendChild(
        boton
      );

    }

  } catch (error) {


    console.error(
      "Error cargando contacto del carpintero:",
      error
    );


    contenedor.innerHTML =
      "";


    const aviso =
      document.createElement(
        "div"
      );


    aviso.className =
      "info";


    aviso.textContent =
      "No pudimos cargar los datos de contacto.";


    contenedor.appendChild(
      aviso
    );

  }

}



function agregarRed(
  contenedor,
  texto,
  valor,
  base
) {


  const url =
    normalizarUrlRed(
      valor,
      base
    );


  if (!url) {
    return;
  }


  const enlace =
    document.createElement(
      "a"
    );


  enlace.href =
    url;


  enlace.target =
    "_blank";


  enlace.rel =
    "noopener noreferrer";


  enlace.textContent =
    texto;


  contenedor.appendChild(
    enlace
  );

}



async function cargarIntereses(
  proyectoId,
  contenedor
) {


  const {
    data,
    error
  } =
    await sb

      .from(
        "intereses_proyectos"
      )

      .select(
        "id,created_at,carpintero_id,estado"
      )

      .eq(
        "proyecto_id",
        proyectoId
      )

      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (
    error ||
    !data?.length
  ) {


    const aviso =
      document.createElement(
        "div"
      );


    aviso.className =
      "aviso";


    aviso.textContent =
      error
        ? "No pudimos cargar los intereses."
        : "Todavía no hay carpinterías interesadas.";


    contenedor.appendChild(
      aviso
    );


    return;

  }



  for (
    const interes of data
  ) {


    const carpinteria =
      obtenerCarpinteria(
        interes.carpintero_id
      );


    const caja =
      document.createElement(
        "div"
      );


    caja.className =
      "interes";



    const superior =
      document.createElement(
        "div"
      );


    superior.className =
      "itop";



    const informacion =
      document.createElement(
        "div"
      );



    const nombre =
      document.createElement(
        "div"
      );


    nombre.className =
      "nombre";


    nombre.textContent =
      carpinteria?.nombre ||
      "Carpintería registrada";


    informacion.appendChild(
      nombre
    );



    const detalle =
      document.createElement(
        "div"
      );


    detalle.className =
      "info";


    const datos =
      [];



    if (
      carpinteria?.localidad ||
      carpinteria?.provincia
    ) {


      let ubicacion =
        "📍 ";


      if (
        carpinteria?.localidad
      ) {

        ubicacion +=
          carpinteria.localidad;

      }


      if (
        carpinteria?.provincia
      ) {

        ubicacion +=
          (
            carpinteria?.localidad
              ? ", "
              : ""
          ) +
          carpinteria.provincia;

      }


      datos.push(
        ubicacion
      );

    }



    if (
      carpinteria?.actividades
    ) {

      datos.push(
        carpinteria.actividades
      );

    }



    if (
      carpinteria?.servicios
    ) {

      datos.push(
        "Servicios: " +
        carpinteria.servicios
      );

    }



    datos.push(
      "Interés: " +
      fecha(
        interes.created_at
      )
    );


    detalle.textContent =
      datos.join(" · ");


    informacion.appendChild(
      detalle
    );



    if (
      carpinteria?.descripcion
    ) {


      const descripcion =
        document.createElement(
          "div"
        );


      descripcion.className =
        "info";


      descripcion.style.marginTop =
        "6px";


      descripcion.textContent =
        carpinteria.descripcion;


      informacion.appendChild(
        descripcion
      );

    }



    if (
      carpinteria?.created_at
    ) {


      const antiguedad =
        document.createElement(
          "div"
        );


      antiguedad.className =
        "info";


      antiguedad.style.marginTop =
        "6px";


      antiguedad.textContent =
        "Miembro de AluConecta desde " +
        fecha(
          carpinteria.created_at
        );


      informacion.appendChild(
        antiguedad
      );

    }



    const redes =
      document.createElement(
        "div"
      );


    redes.className =
      "redes";


    agregarRed(
      redes,
      "Instagram",
      carpinteria?.instagram,
      "https://instagram.com/"
    );


    agregarRed(
      redes,
      "Facebook",
      carpinteria?.facebook,
      "https://facebook.com/"
    );


    agregarRed(
      redes,
      "TikTok",
      carpinteria?.tiktok,
      "https://tiktok.com/@"
    );


    agregarRed(
      redes,
      "Sitio web",
      carpinteria?.web,
      null
    );


    if (
      redes.children.length > 0
    ) {

      informacion.appendChild(
        redes
      );

    }



    if (
      interes.estado ===
      "autorizado"
    ) {


      const contacto =
        document.createElement(
          "div"
        );


      contacto.className =
        "contacto";


      const cargandoContacto =
        document.createElement(
          "span"
        );


      cargandoContacto.className =
        "info";


      cargandoContacto.textContent =
        "Consultando datos de contacto...";


      contacto.appendChild(
        cargandoContacto
      );


      informacion.appendChild(
        contacto
      );


      cargarContactoCarpintero(
        proyectoId,
        interes.carpintero_id,
        contacto
      );

    }



    const estado =
      document.createElement(
        "span"
      );


    estado.className =
      "estado " +
      interes.estado;


    estado.textContent =

      interes.estado ===
      "autorizado"

        ? "Autorizado"

        : interes.estado ===
          "no_autorizado"

          ? "No autorizado"

          : "Interesado";


    superior.append(
      informacion,
      estado
    );



    const acciones =
      document.createElement(
        "div"
      );


    acciones.className =
      "acciones";



    const autorizar =
      document.createElement(
        "button"
      );


    autorizar.type =
      "button";


    autorizar.className =
      "si";


    autorizar.textContent =
      interes.estado ===
      "autorizado"

        ? "AUTORIZADO"

        : "AUTORIZAR";


    autorizar.disabled =
      interes.estado ===
      "autorizado";


    autorizar.addEventListener(
      "click",
      function() {

        actualizarEstado(
          interes.id,
          "autorizado"
        );

      }
    );



    const rechazar =
      document.createElement(
        "button"
      );


    rechazar.type =
      "button";


    rechazar.className =
      "no";


    rechazar.textContent =
      interes.estado ===
      "no_autorizado"

        ? "NO AUTORIZADO"

        : "NO AUTORIZAR";


    rechazar.disabled =
      interes.estado ===
      "no_autorizado";


    rechazar.addEventListener(
      "click",
      function() {

        actualizarEstado(
          interes.id,
          "no_autorizado"
        );

      }
    );


    acciones.append(
      autorizar,
      rechazar
    );


    caja.append(
      superior,
      acciones
    );


    contenedor.appendChild(
      caja
    );

  }

}



async function abrirArchivoCotizacion(
  ruta
) {


  const ventana =
    window.open(
      "",
      "_blank"
    );


  try {


    const {
      data,
      error
    } =
      await sb.storage

        .from(
          "cotizaciones-archivos"
        )

        .createSignedUrl(
          ruta,
          60
        );


    if (
      error ||
      !data?.signedUrl
    ) {

      throw (
        error ||
        new Error(
          "No pudimos generar el acceso."
        )
      );

    }


    if (ventana) {

      ventana.location.href =
        data.signedUrl;

    } else {

      window.location.href =
        data.signedUrl;

    }


  } catch (error) {


    if (ventana) {
      ventana.close();
    }


    mostrarMensaje(
      "No pudimos abrir el presupuesto: " +
      (
        error.message ||
        "error desconocido"
      ),
      "error"
    );

  }

}



async function cargarCotizaciones(
  proyectoId,
  contenedor
) {


  const bloque =
    document.createElement(
      "div"
    );


  bloque.className =
    "cotizaciones";


  const titulo =
    document.createElement(
      "h4"
    );


  titulo.textContent =
    "Cotizaciones recibidas";


  bloque.appendChild(
    titulo
  );



  const cargando =
    document.createElement(
      "div"
    );


  cargando.className =
    "muted";


  cargando.textContent =
    "Consultando cotizaciones...";


  bloque.appendChild(
    cargando
  );


  contenedor.appendChild(
    bloque
  );



  const {
    data,
    error
  } =
    await sb

      .from(
        "cotizaciones"
      )

      .select(
        "id,fabricante_id,precio,plazo_entrega,comentario_calidad,marca_perfil_cotizada,marca_herrajes_cotizada,created_at"
      )

      .eq(
        "obra_id",
        proyectoId
      )

      .order(
        "created_at",
        {
          ascending: false
        }
      );


  cargando.remove();



  if (error) {


    const aviso =
      document.createElement(
        "div"
      );


    aviso.className =
      "muted";


    aviso.textContent =
      "No pudimos consultar las cotizaciones.";


    bloque.appendChild(
      aviso
    );


    return;

  }



  if (
    !data ||
    data.length === 0
  ) {


    const vacio =
      document.createElement(
        "div"
      );


    vacio.className =
      "muted";


    vacio.textContent =
      "Todavía no recibiste cotizaciones para este proyecto.";


    bloque.appendChild(
      vacio
    );


    return;

  }



  for (
    const cotizacion
    of data
  ) {


    const caja =
      document.createElement(
        "div"
      );


    caja.className =
      "cotizacion";



    const carpinteria =
      obtenerCarpinteria(
        cotizacion.fabricante_id
      );



    const encabezado =
      document.createElement(
        "strong"
      );


    encabezado.textContent =
      carpinteria?.nombre ||
      "Carpintería registrada";


    caja.appendChild(
      encabezado
    );



    const tipoCotizacion =
      document.createElement(
        "div"
      );


    tipoCotizacion.className =
      "muted";


    tipoCotizacion.style.marginTop =
      "4px";


    tipoCotizacion.textContent =
      "Cotización recibida";


    caja.appendChild(
      tipoCotizacion
    );



    if (
      cotizacion.precio !==
      null
    ) {


      const precio =
        document.createElement(
          "div"
        );


      precio.style.marginTop =
        "8px";


      precio.textContent =
        "Precio informado: " +
        cotizacion.precio;


      caja.appendChild(
        precio
      );

    }



    if (
      cotizacion.plazo_entrega
    ) {


      const plazo =
        document.createElement(
          "div"
        );


      plazo.style.marginTop =
        "6px";


      plazo.textContent =
        "Plazo: " +
        cotizacion.plazo_entrega;


      caja.appendChild(
        plazo
      );

    }



    if (
      cotizacion.marca_perfil_cotizada
    ) {


      const perfileria =
        document.createElement(
          "div"
        );


      perfileria.style.marginTop =
        "6px";


      perfileria.textContent =
        "Perfilería: " +
        cotizacion.marca_perfil_cotizada;


      caja.appendChild(
        perfileria
      );

    }



    if (
      cotizacion.marca_herrajes_cotizada
    ) {


      const herrajes =
        document.createElement(
          "div"
        );


      herrajes.style.marginTop =
        "6px";


      herrajes.textContent =
        "Herrajes: " +
        cotizacion.marca_herrajes_cotizada;


      caja.appendChild(
        herrajes
      );

    }



    if (
      cotizacion.comentario_calidad
    ) {


      const comentario =
        document.createElement(
          "div"
        );


      comentario.style.marginTop =
        "8px";


      comentario.className =
        "muted";


      comentario.textContent =
        cotizacion.comentario_calidad;


      caja.appendChild(
        comentario
      );

    }



    const documentos =
      document.createElement(
        "div"
      );


    documentos.style.marginTop =
      "10px";


    const cargandoArchivos =
      document.createElement(
        "span"
      );


    cargandoArchivos.className =
      "muted";


    cargandoArchivos.textContent =
      "Consultando archivos adjuntos...";


    documentos.appendChild(
      cargandoArchivos
    );


    caja.appendChild(
      documentos
    );


    bloque.appendChild(
      caja
    );



    const {
      data: archivos,
      error: archivosError
    } =
      await sb

        .from(
          "archivos_cotizacion"
        )

        .select(
          "id,nombre_archivo,ruta_storage"
        )

        .eq(
          "cotizacion_id",
          cotizacion.id
        )

        .order(
          "created_at",
          {
            ascending: true
          }
        );


    documentos.innerHTML =
      "";



    if (
      archivosError
    ) {


      documentos.textContent =
        "No pudimos consultar los archivos de esta cotización.";


      continue;

    }



    if (
      !archivos ||
      archivos.length === 0
    ) {


      const sinArchivos =
        document.createElement(
          "span"
        );


      sinArchivos.className =
        "muted";


      sinArchivos.textContent =
        "Esta cotización no tiene archivos adjuntos.";


      documentos.appendChild(
        sinArchivos
      );


      continue;

    }



    for (
      const archivo
      of archivos
    ) {


      const boton =
        document.createElement(
          "button"
        );


      boton.type =
        "button";


      boton.className =
        "archivo";


      boton.textContent =
        "VER / DESCARGAR · " +
        archivo.nombre_archivo;


      boton.addEventListener(
        "click",
        function() {

          abrirArchivoCotizacion(
            archivo.ruta_storage
          );

        }
      );


      documentos.appendChild(
        boton
      );

    }

  }

}



async function cargarProyectos() {


  lista.innerHTML =
    "";


  const {
    data,
    error,
    count
  } =
    await sb

      .from(
        "proyectos"
      )

      .select(
        "id,created_at,Nombre,Tipo,Localidad,Proyecto",
        {
          count: "exact"
        }
      )

      .eq(
        "publicado_por",
        user.id
      )

      .order(
        "created_at",
        {
          ascending: false
        }
      );



  if (error) {


    resumen.textContent =
      "No disponible";


    const aviso =
      document.createElement(
        "div"
      );


    aviso.className =
      "aviso";


    aviso.textContent =
      "No pudimos cargar tus proyectos.";


    lista.appendChild(
      aviso
    );


    return;

  }



  const total =
    count ??
    data.length;


  resumen.textContent =
    total +
    " proyecto" +
    (
      total === 1
        ? ""
        : "s"
    ) +
    " publicado" +
    (
      total === 1
        ? ""
        : "s"
    );



  if (
    !data.length
  ) {


    const aviso =
      document.createElement(
        "div"
      );


    aviso.className =
      "aviso";


    aviso.textContent =
      "Todavía no publicaste proyectos.";


    lista.appendChild(
      aviso
    );


    return;

  }



  for (
    const proyecto
    of data
  ) {


    const caja =
      document.createElement(
        "article"
      );


    caja.className =
      "proyecto";



    const titulo =
      document.createElement(
        "h3"
      );


    titulo.textContent =
      proyecto.Nombre ||
      "Proyecto sin nombre";



    const meta =
      document.createElement(
        "div"
      );


    meta.className =
      "meta";


    meta.textContent =
      "📍 " +
      (
        proyecto.Localidad ||
        "Localidad no indicada"
      ) +
      " · " +
      (
        proyecto.Tipo ||
        "Proyecto"
      ) +
      " · " +
      fecha(
        proyecto.created_at
      );


    caja.append(
      titulo,
      meta
    );



    if (
      proyecto.Proyecto
    ) {


      const descripcion =
        document.createElement(
          "div"
        );


      descripcion.className =
        "desc";


      descripcion.textContent =
        proyecto.Proyecto;


      caja.appendChild(
        descripcion
      );

    }



    const tituloIntereses =
      document.createElement(
        "div"
      );


    tituloIntereses.className =
      "titulo-seccion";


    tituloIntereses.textContent =
      "Carpinterías interesadas";



    const contenedorIntereses =
      document.createElement(
        "div"
      );


    caja.append(
      tituloIntereses,
      contenedorIntereses
    );


    lista.appendChild(
      caja
    );



    await cargarIntereses(
      proyecto.id,
      contenedorIntereses
    );


    await cargarCotizaciones(
      proyecto.id,
      caja
    );

  }

}



async function iniciarPagina() {


  try {


    const {
      data: usuarioData,
      error: usuarioError
    } =
      await sb.auth
        .getUser();


    const usuario =
      usuarioData?.user;


    if (
      usuarioError ||
      !usuario
    ) {

      window.location.href =
        "ingresar.html";

      return;

    }


    user =
      usuario;



    const {
      data: perfil,
      error: perfilError
    } =
      await sb

        .from(
          "perfiles"
        )

        .select(
          "id,tipo_usuario"
        )

        .eq(
          "id",
          user.id
        )

        .single();



    if (
      perfilError ||
      !perfil
    ) {

      throw new Error(
        "No pudimos verificar tu cuenta."
      );

    }



    if (
      perfil.tipo_usuario ===
      "carpintero"
    ) {

      window.location.href =
        "panel-carpintero.html";

      return;

    }



    if (
      !esRolProfesional(
        perfil.tipo_usuario
      )
    ) {

      throw new Error(
        "Esta cuenta no tiene acceso al panel de proyectos."
      );

    }



    /*
      Cargamos una única vez los perfiles
      comerciales permitidos de carpinterías.

      Desde este punto no se consulta
      directamente carpinteros_visibles.
    */

    await cargarCarpinteriasVisibles();



    document.getElementById(
      "cargando"
    ).style.display =
      "none";


    await cargarProyectos();


  } catch (error) {


    console.error(
      "Error al abrir Mis proyectos:",
      error
    );


    document.getElementById(
      "cargando"
    ).style.display =
      "none";


    mostrarMensaje(
      error.message ||
      "No pudimos abrir tus proyectos.",
      "error"
    );

  }

}



iniciarPagina();


</script>
