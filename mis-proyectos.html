<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mis proyectos - AluConecta</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--a:#132e4f;--y:#ffcf00;--f:#f5f7fa;--b:#e2e8f0;--g:#64748b;--v:#166534;--r:#991b1b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--f);color:var(--a)}header,.hero{background:var(--a);color:#fff}.head,main,.hero>div{max-width:900px;margin:auto}.head{padding:15px 18px;display:flex;justify-content:space-between}.logo{font-size:26px;font-weight:900}.logo span{color:#4fb0e2}a{color:inherit}.volver{color:#fff;text-decoration:none;font-size:13px}.hero{padding:25px 18px 32px}.hero h1{margin:0 0 8px;font-size:36px}.hero h1 span{color:var(--y)}.hero p{margin:0;color:#b9c7d6;font-size:13px}main{padding:20px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h2{margin:0}.sub,.meta,.info{color:var(--g);font-size:11px;line-height:1.6}.nuevo{background:var(--y);text-decoration:none;padding:11px 15px;border-radius:999px;font-size:11px;font-weight:900}.proyecto{background:#fff;border:1px solid var(--b);border-radius:18px;padding:18px;margin-bottom:16px}.proyecto h3{margin:0 0 7px}.desc{margin:14px 0;color:#475569;font-size:13px;line-height:1.6;white-space:pre-wrap}.ti{border-top:1px solid var(--b);padding-top:14px;margin-top:14px;font-size:13px;font-weight:900}.interes{margin-top:10px;border:1px solid var(--b);background:#fafbfc;border-radius:13px;padding:13px}.itop{display:flex;justify-content:space-between;gap:10px}.nombre{font-size:13px;font-weight:900}.estado{height:max-content;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:900;text-transform:uppercase}.interesado{background:#fef3c7;color:#92400e}.autorizado{background:#dcfce7;color:var(--v)}.no_autorizado{background:#fee2e2;color:var(--r)}.acciones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}button{border:0;border-radius:999px;padding:10px;font-size:10px;font-weight:900}.si{background:var(--y);color:var(--a)}.no{background:#e2e8f0;color:#475569}button:disabled{opacity:.5}.aviso{padding:14px;background:#f1f5f9;color:var(--g);border-radius:12px;font-size:12px}.msg{display:none;padding:13px;border-radius:12px;margin-bottom:15px;font-size:12px}.msg.ok{display:block;background:#dcfce7;color:var(--v)}.msg.error{display:block;background:#fee2e2;color:var(--r)}#cargando{position:fixed;inset:0;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;z-index:100}footer{text-align:center;color:#94a3b8;border-top:1px solid var(--b);padding:22px;font-size:10px}@media(max-width:600px){.itop{flex-direction:column}.acciones{grid-template-columns:1fr}}
</style></head><body>
<div id="cargando"><strong>Verificando tu cuenta...</strong></div>
<header><div class="head"><div class="logo">Alu<span>Conecta</span></div><a class="volver" href="panel-cliente.html">← Mi panel</a></div></header>
<section class="hero"><div><h1>Mis <span>proyectos.</span></h1><p>Administrá tus proyectos y decidí qué carpinterías pueden acceder a la documentación técnica privada.</p></div></section>
<main><div class="top"><div><h2>Proyectos publicados</h2><div id="resumen" class="sub">Cargando...</div></div><a class="nuevo" href="publicar-proyecto.html">+ NUEVO PROYECTO</a></div><div id="mensaje" class="msg"></div><div id="lista"></div></main>
<footer>© 2026 AluConecta<br>Donde los proyectos encuentran sus aberturas.</footer>
<script>
const sb=window.supabase.createClient('https://wroaxwjyjrxzwctfkyoo.supabase.co','sb_publishable_35152HM4RtYst1yA2a79zA_zIh6yDs3');
let user=null;const lista=document.querySelector('#lista'),resumen=document.querySelector('#resumen'),mensaje=document.querySelector('#mensaje');
const f=v=>v?new Intl.DateTimeFormat('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(v)):'';
function msg(t,c){mensaje.className='msg '+c;mensaje.textContent=t}
async function pub(id){const{data,error}=await sb.from('perfiles_publicos').select('id,actividades,localidad,servicios').eq('id',id).maybeSingle();return error?null:data}
async function estado(id,e){const{error}=await sb.from('intereses_proyectos').update({estado:e}).eq('id',id);if(error){msg('No pudimos actualizar: '+error.message,'error');return}msg(e==='autorizado'?'Carpintería autorizada correctamente.':'Carpintería marcada como no autorizada.','ok');await proyectos()}
async function intereses(pid,c){
 const{data,error}=await sb.from('intereses_proyectos').select('id,created_at,carpintero_id,estado').eq('proyecto_id',pid).order('created_at',{ascending:false});
 if(error||!data?.length){const a=document.createElement('div');a.className='aviso';a.textContent=error?'No pudimos cargar los intereses.':'Todavía no hay carpinterías interesadas.';c.append(a);return}
 for(const i of data){const p=await pub(i.carpintero_id),x=document.createElement('div');x.className='interes';const top=document.createElement('div');top.className='itop';const d=document.createElement('div'),n=document.createElement('div'),inf=document.createElement('div');n.className='nombre';n.textContent='Carpintería interesada';inf.className='info';inf.textContent=(p?.localidad?'📍 '+p.localidad+' · ':'')+(p?.actividades?'Actividad: '+p.actividades+' · ':'')+(p?.servicios?'Servicios: '+p.servicios+' · ':'')+'Interés: '+f(i.created_at);d.append(n,inf);const es=document.createElement('span');es.className='estado '+i.estado;es.textContent=i.estado==='autorizado'?'Autorizado':i.estado==='no_autorizado'?'No autorizado':'Interesado';top.append(d,es);const ac=document.createElement('div');ac.className='acciones';const si=document.createElement('button'),no=document.createElement('button');si.className='si';no.className='no';si.textContent=i.estado==='autorizado'?'AUTORIZADO':'AUTORIZAR';no.textContent=i.estado==='no_autorizado'?'NO AUTORIZADO':'NO AUTORIZAR';si.disabled=i.estado==='autorizado';no.disabled=i.estado==='no_autorizado';si.onclick=()=>estado(i.id,'autorizado');no.onclick=()=>estado(i.id,'no_autorizado');ac.append(si,no);x.append(top,ac);c.append(x)}
}
async function proyectos(){
 lista.innerHTML='';const{data,error,count}=await sb.from('proyectos').select('id,created_at,Nombre,Tipo,Localidad,Proyecto',{count:'exact'}).eq('publicado_por',user.id).order('created_at',{ascending:false});
 if(error){resumen.textContent='No disponible';const a=document.createElement('div');a.className='aviso';a.textContent='No pudimos cargar tus proyectos.';lista.append(a);return}
 resumen.textContent=(count??data.length)+' proyecto'+((count??data.length)===1?'':'s')+' publicado'+((count??data.length)===1?'':'s');
 if(!data.length){const a=document.createElement('div');a.className='aviso';a.textContent='Todavía no publicaste proyectos.';lista.append(a);return}
 for(const p of data){const c=document.createElement('article');c.className='proyecto';const h=document.createElement('h3');h.textContent=p.Nombre||'Proyecto sin nombre';const m=document.createElement('div');m.className='meta';m.textContent='📍 '+(p.Localidad||'Localidad no indicada')+' · '+(p.Tipo||'Proyecto')+' · '+f(p.created_at);c.append(h,m);if(p.Proyecto){const d=document.createElement('div');d.className='desc';d.textContent=p.Proyecto;c.append(d)}const t=document.createElement('div'),ins=document.createElement('div');t.className='ti';t.textContent='Carpinterías interesadas';c.append(t,ins);lista.append(c);await intereses(p.id,ins)}
}
async function iniciarPagina(){try{const{data:{user:u},error:a}=await sb.auth.getUser();if(a||!u){location.href='ingresar.html';return}user=u;const{data:p,error:e}=await sb.from('perfiles').select('id,tipo_usuario').eq('id',u.id).single();if(e||!p)throw Error('No pudimos verificar tu perfil.');if(p.tipo_usuario==='carpintero'){location.href='panel-carpintero.html';return}document.querySelector('#cargando').style.display='none';await proyectos()}catch(e){document.querySelector('#cargando').style.display='none';msg(e.message||'No pudimos abrir tus proyectos.','error')}}
iniciarPagina();
</script></body></html>
