<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Confirmando cuenta - AluConecta</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --azul: #0f2e4d;
      --celeste: #5bc0de;
      --amarillo: #f5c542;
      --amarillo-hover: #e5b632;
      --fondo: #f4f6f8;
      --texto: #24313d;
      --suave: #64748b;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family:
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Arial,
        sans-serif;
      background: var(--fondo);
      color: var(--texto);
    }

    header {
      background: var(--azul);
      padding: 25px 20px 60px;
      text-align: center;
    }

    .marca {
      color: white;
      font-size: 21px;
      font-weight: 800;
    }

    .marca span {
      color: var(--celeste);
    }

    main {
      width: calc(100% - 32px);
      max-width: 520px;
      flex: 1;
      margin: -30px auto 40px;
      position: relative;
    }

    .tarjeta {
      min-height: 300px;
      padding: 36px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: white;
      border: 1px solid rgba(15,46,77,.07);
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(15,46,77,.09);
      text-align: center;
    }

    .estado-icono {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
    }

    .estado-icono svg {
      width: 31px;
      height: 31px;
    }

    .estado-icono.cargando {
      background: #edf8fb;
      color: var(--azul);
    }

    .estado-icono.exito {
      background: #dcfce7;
      color: #166534;
    }

    .estado-icono.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .spinner {
      width: 29px;
      height: 29px;
      border: 3px solid #cdebf3;
      border-top-color: var(--azul);
      border-radius: 50%;
      animation: girar .8s linear infinite;
    }

    @keyframes girar {
      to {
        transform: rotate(360deg);
      }
    }

    h1 {
      margin: 0 0 10px;
      color: var(--azul);
      font-size: 25px;
      line-height: 1.25;
    }

    .descripcion {
      max-width: 390px;
      margin: 0 auto;
      color: var(--suave);
      font-size: 14px;
      line-height: 1.6;
    }

    .boton {
      display: inline-flex;
      min-height: 50px;
      margin-top: 24px;
      padding: 12px 22px;
      align-items: center;
      justify-content: center;
      border-radius: 11px;
      background: var(--amarillo);
      color: var(--azul);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }

    .boton:hover {
      background: var(--amarillo-hover);
    }

    .detalle-error {
      margin: 18px 0 0;
      padding: 13px;
      border-radius: 11px;
      background: #fff5f5;
      color: #991b1b;
      font-size: 13px;
      line-height: 1.5;
    }

    footer {
      padding: 26px 20px;
      background: var(--azul);
      color: #c8d5e1;
      text-align: center;
      font-size: 13px;
      line-height: 1.7;
    }

    @media (max-width: 560px) {
      header {
        padding: 23px 18px 54px;
      }

      main {
        width: calc(100% - 24px);
      }

      .tarjeta {
        min-height: 280px;
        padding: 31px 21px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>


<body>

<header>

  <div class="marca">
    Alu<span>Conecta</span>
  </div>

</header>


<main>

  <section class="tarjeta">

    <div id="contenido">

      <div class="estado-icono cargando">
        <div
          class="spinner"
          aria-label="Verificando cuenta"
        ></div>
      </div>

      <h1>
        Estamos verificando tu cuenta
      </h1>

      <p class="descripcion">
        Esperá unos segundos mientras completamos
        tu registro en AluConecta.
      </p>

    </div>

  </section>

</main>


<footer>
  © 2026 AluConecta
  <br>
  Donde los proyectos encuentran sus aberturas.
</footer>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script>

const SUPABASE_URL =
  'https://wroaxwjyjrxzwctfkyoo.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_35152HM4RtYst1yA2a79zA_zIh6yDs3';


const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const contenido =
  document.getElementById(
    'contenido'
  );


function escapeHtml(value) {

  const div =
    document.createElement('div');

  div.textContent =
    String(value || '');

  return div.innerHTML;

}


function mostrarError(
  texto,
  tipoUsuario = null
) {

  let destino =
    'acceso.html';


  if (
    tipoUsuario ===
    'cliente_profesional'
  ) {

    destino =
      'registro-cliente.html';

  }


  if (
    tipoUsuario ===
    'carpintero'
  ) {

    destino =
      'registro-carpintero.html';

  }


  contenido.innerHTML = `

    <div class="estado-icono error">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v6"/>
        <path d="M12 17h.01"/>
      </svg>

    </div>

    <h1>
      No pudimos completar el registro
    </h1>

    <p class="descripcion">
      Revisá la información del registro
      e intentá nuevamente.
    </p>

    <div class="detalle-error">
      ${escapeHtml(texto)}
    </div>

    <a
      href="${destino}"
      class="boton"
    >
      VOLVER AL REGISTRO
    </a>

  `;

}


function mostrarExito(
  tipoUsuario
) {

  const esCarpintero =
    tipoUsuario ===
    'carpintero';


  const titulo =
    esCarpintero
      ? 'Tu carpintería ya está registrada'
      : 'Tu cuenta profesional ya está registrada';


  const texto =
    esCarpintero

      ? 'Tu correo fue verificado y tu perfil de carpintería quedó creado correctamente en AluConecta.'

      : 'Tu correo fue verificado y tu cuenta profesional quedó creada correctamente en AluConecta.';


  contenido.innerHTML = `

    <div class="estado-icono exito">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="9"/>
        <path d="m8 12 2.7 2.7L16.5 9"/>
      </svg>

    </div>

    <h1>
      ${titulo}
    </h1>

    <p class="descripcion">
      ${texto}
    </p>

    <a
      href="ingresar.html"
      class="boton"
    >
      CONTINUAR
    </a>

  `;

}


function validarCliente(
  metadata
) {

  return Boolean(
    metadata.nombre &&
    metadata.rol &&
    metadata.whatsapp &&
    metadata.dni &&
    metadata.provincia &&
    metadata.localidad
  );

}


function validarCarpintero(
  metadata
) {

  return Boolean(
    metadata.nombre &&
    metadata.whatsapp &&
    metadata.provincia &&
    metadata.localidad &&
    metadata.zonas
  );

}


async function guardarCliente(
  user,
  metadata
) {

  if (
    !validarCliente(metadata)
  ) {

    throw new Error(
      'El registro está incompleto. Volvé al formulario para completar tus datos.'
    );

  }


  const perfil = {

    id:
      user.id,

    nombre:
      metadata.nombre,

    tipo_usuario:
      'cliente_profesional',

    actividades:
      metadata.rol,

    localidad:
      metadata.localidad,

    telefono:
      metadata.whatsapp,

    dni:
      metadata.dni,

    provincia:
      metadata.provincia

  };


  const {
    error
  } =
    await sb
      .from('perfiles')
      .upsert(
        perfil,
        {
          onConflict: 'id'
        }
      );


  if (error) {
    throw error;
  }

}


async function guardarCarpintero(
  user,
  metadata
) {

  if (
    !validarCarpintero(metadata)
  ) {

    throw new Error(
      'El registro de la carpintería está incompleto. Volvé al formulario para completar tus datos.'
    );

  }


  const perfiles =
    Array.isArray(
      metadata.marcas_perfiles
    )
      ? metadata.marcas_perfiles
      : [];


  const herrajes =
    Array.isArray(
      metadata.marcas_herrajes
    )
      ? metadata.marcas_herrajes
      : [];


  const descripcionPartes =
    [];


  if (perfiles.length) {

    descripcionPartes.push(
      'Sistemas de perfiles: ' +
      perfiles.join(', ')
    );

  }


  if (herrajes.length) {

    descripcionPartes.push(
      'Herrajes: ' +
      herrajes.join(', ')
    );

  }


  const descripcion =
    descripcionPartes.length

      ? descripcionPartes.join(
          ' · '
        )

      : 'Carpintería de aluminio';


  const perfil = {

    id:
      user.id,

    nombre:
      metadata.nombre,

    tipo_usuario:
      'carpintero',

    actividades:
      'Carpintería de aluminio',

    participacion:
      'ofrece_servicios',

    localidad:
      metadata.localidad,

    servicios:
      metadata.zonas,

    telefono:
      metadata.whatsapp,

    descripcion:
      descripcion,

    provincia:
      metadata.provincia

  };


  const {
    error
  } =
    await sb
      .from('perfiles')
      .upsert(
        perfil,
        {
          onConflict: 'id'
        }
      );


  if (error) {
    throw error;
  }

}


async function confirmarCuenta() {

  let tipoUsuario =
    null;


  try {

    const {
      data,
      error
    } =
      await sb.auth.getSession();


    if (error) {
      throw error;
    }


    if (
      !data.session ||
      !data.session.user
    ) {

      throw new Error(
        'No encontramos una sesión válida. El enlace puede haber vencido o ya haber sido utilizado.'
      );

    }


    const user =
      data.session.user;


    const metadata =
      user.user_metadata || {};


    tipoUsuario =
      metadata.tipo_usuario ||
      null;


    if (
      tipoUsuario ===
      'cliente_profesional'
    ) {

      await guardarCliente(
        user,
        metadata
      );


      mostrarExito(
        tipoUsuario
      );


      return;

    }


    if (
      tipoUsuario ===
      'carpintero'
    ) {

      await guardarCarpintero(
        user,
        metadata
      );


      mostrarExito(
        tipoUsuario
      );


      return;

    }


    throw new Error(
      'No encontramos el tipo de usuario necesario para completar este registro.'
    );


  } catch (error) {

    console.error(
      'Error al completar el registro:',
      error
    );


    mostrarError(
      error.message ||
      'Ocurrió un error inesperado.',
      tipoUsuario
    );

  }

}


confirmarCuenta();

</script>


</body>
</html>
