<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ingresar - AluConecta</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1f2937;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    header h1 { margin: 0 0 10px; }
    header p { margin: 0; }

    .contenedor {
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    .tarjeta {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    .intro {
      text-align: center;
      color: #555;
      margin-bottom: 25px;
    }

    .campo { margin-bottom: 20px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .password-contenedor { position: relative; }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    #password { padding-right: 50px; }

    .ver-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      cursor: pointer;
      font-size: 20px;
      padding: 4px;
    }

    .olvido {
      display: block;
      text-align: right;
      margin-top: -8px;
      margin-bottom: 22px;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .boton {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .boton:disabled {
      opacity: .6;
      cursor: wait;
    }

    .mensaje {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      line-height: 1.5;
    }

    .mensaje.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .mensaje.exito {
      background: #dcfce7;
      color: #166534;
    }

    .enlace {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .registro {
      text-align: center;
      margin-top: 25px;
      color: #555;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>AluConecta</h1>
  <p>Personas, profesionales y empresas conectadas.</p>
</header>

<main class="contenedor">

  <section class="tarjeta">

    <h2>Ingresar</h2>

    <p class="intro">
      Ingresá a tu cuenta de AluConecta.
    </p>

    <form id="formularioLogin">

      <div class="campo">

        <label for="email">
          Correo electrónico
        </label>

        <input
          type="email"
          id="email"
          placeholder="tu@email.com"
          autocomplete="email"
          required
        >

      </div>

      <div class="campo">

        <label for="password">
          Contraseña
        </label>

        <div class="password-contenedor">

          <input
            type="password"
            id="password"
            placeholder="Tu contraseña"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="ver-password"
            id="verPassword"
            aria-label="Mostrar contraseña"
          >
            👁️
          </button>

        </div>

      </div>

      <a
        href="recuperar-password.html"
        class="olvido"
      >
        ¿Olvidaste tu contraseña?
      </a>

      <button
        type="submit"
        class="boton"
        id="botonLogin"
      >
        Ingresar
      </button>

    </form>

    <div
      id="mensaje"
      class="mensaje"
    ></div>

    <a
      href="index.html"
      class="enlace"
    >
      ← Volver a AluConecta
    </a>

    <div class="registro">

      ¿Todavía no tenés una cuenta?

      <a
        href="acceso.html"
        class="enlace"
      >
        Crear mi cuenta
      </a>

    </div>

  </section>

</main>

<footer>
  <p>© 2026 AluConecta</p>

  <p>
    Conectando personas, trabajos y oportunidades.
  </p>
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  'https://wroaxwjyjrxzwctfkyoo.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_35152HM4RtYst1yA2a79zA_zIh6yDs3';

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const formulario =
  document.getElementById('formularioLogin');

const boton =
  document.getElementById('botonLogin');

const mensaje =
  document.getElementById('mensaje');

const emailInput =
  document.getElementById('email');

const passwordInput =
  document.getElementById('password');

const verPassword =
  document.getElementById('verPassword');


verPassword.addEventListener(
  'click',
  function() {

    if (
      passwordInput.type === 'password'
    ) {

      passwordInput.type = 'text';
      verPassword.textContent = '🙈';

      verPassword.setAttribute(
        'aria-label',
        'Ocultar contraseña'
      );

    } else {

      passwordInput.type = 'password';
      verPassword.textContent = '👁️';

      verPassword.setAttribute(
        'aria-label',
        'Mostrar contraseña'
      );

    }

  }
);


function mostrarMensaje(
  texto,
  tipo
) {

  mensaje.className =
    'mensaje ' + tipo;

  mensaje.textContent =
    texto;

  mensaje.style.display =
    'block';

}


function destinoPorTipo(tipoUsuario) {

  if (
    tipoUsuario === 'carpintero'
  ) {

    return 'panel-carpintero.html';

  }

  return 'panel-cliente.html';

}
  




async function obtenerTipoUsuario(user) {

  /*
   * Primero consultamos perfiles.
   * Esta es nuestra fuente de verdad
   * para el perfil de AluConecta.
   */

  const {
    data,
    error
  } =
    await sb
      .from('perfiles')
      .select('tipo_usuario')
      .eq('id', user.id)
      .maybeSingle();


  if (error) {
    throw error;
  }


  if (
    data &&
    data.tipo_usuario
  ) {

    return data.tipo_usuario;

  }


  /*
   * Respaldo para cuentas recién confirmadas:
   * usamos metadata solamente para decidir
   * la navegación, nunca como autorización.
   */

  return (
    user.user_metadata?.tipo_usuario ||
    null
  );

}


formulario.addEventListener(
  'submit',
  async function(event) {

    event.preventDefault();


    mensaje.style.display =
      'none';


    const email =
      emailInput.value
        .trim()
        .toLowerCase();

    const password =
      passwordInput.value;


    if (
      !email ||
      !password
    ) {

      mostrarMensaje(
        'Ingresá tu correo y contraseña.',
        'error'
      );

      return;

    }


    boton.disabled = true;

    boton.textContent =
      'Ingresando...';


    try {

      const {
        data,
        error
      } =
        await sb.auth.signInWithPassword({

          email,
          password

        });


      if (error) {
        throw error;
      }


      if (
        !data.user
      ) {

        throw new Error(
          'No se pudo iniciar la sesión.'
        );

      }


      const tipoUsuario =
        await obtenerTipoUsuario(
          data.user
        );


      if (!tipoUsuario) {

        await sb.auth.signOut();

        throw new Error(
          'Tu cuenta existe, pero no encontramos un perfil de AluConecta asociado.'
        );

      }


      const destino =
        destinoPorTipo(
          tipoUsuario
        );


      mostrarMensaje(
        '¡Bienvenido/a a AluConecta! Ingresaste correctamente.',
        'exito'
      );


      setTimeout(
        function() {

          window.location.href =
            destino;

        },
        700
      );


    } catch (error) {

      console.error(
        'Error al iniciar sesión:',
        error
      );


      let texto =
        error.message ||
        'No pudimos iniciar sesión.';


      if (
        texto
          .toLowerCase()
          .includes(
            'invalid login credentials'
          )
      ) {

        texto =
          'Correo o contraseña incorrectos.';

      }


      if (
        texto
          .toLowerCase()
          .includes(
            'email not confirmed'
          )
      ) {

        texto =
          'Primero tenés que verificar tu correo electrónico.';

      }


      mostrarMensaje(
        texto,
        'error'
      );


    } finally {

      boton.disabled = false;

      boton.textContent =
        'Ingresar';

    }

  }
);

</script>

</body>
</html>
