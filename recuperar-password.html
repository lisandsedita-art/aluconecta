
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Recuperar contraseña - AluConecta</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1f2937;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    header h1 {
      margin: 0 0 10px;
    }

    header p {
      margin: 0;
    }

    .contenedor {
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    .tarjeta {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    .texto {
      text-align: center;
      color: #555;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .campo {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    .boton {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .boton:hover {
      background: #1d4ed8;
    }

    .boton:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .mensaje {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      line-height: 1.5;
    }

    .mensaje.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .mensaje.exito {
      background: #dcfce7;
      color: #166534;
    }

    .enlace {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .enlace:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>AluConecta</h1>
  <p>Personas, profesionales y empresas conectadas.</p>
</header>

<main class="contenedor">

  <section class="tarjeta">

    <h2>Recuperar contraseña</h2>

    <p class="texto">
      Ingresá el correo electrónico con el que creaste
      tu cuenta y te enviaremos un enlace para establecer
      una nueva contraseña.
    </p>

    <form id="formularioRecuperacion">

      <div class="campo">

        <label for="email">
          Correo electrónico
        </label>

        <input
          type="email"
          id="email"
          placeholder="tu@email.com"
          autocomplete="email"
          required>

      </div>

      <button
        type="submit"
        class="boton"
        id="botonRecuperacion">

        Enviar enlace de recuperación

      </button>

    </form>

    <div
      id="mensaje"
      class="mensaje">
    </div>

    <a
      href="login.html"
      class="enlace">
      ← Volver a ingresar
    </a>

  </section>

</main>

<footer>

  <p>© 2026 AluConecta</p>

  <p>
    Conectando personas, trabajos y oportunidades.
  </p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://wroaxwjyjrxzwctfkyoo.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_35152HM4RtYst1yA2a79zA_zIh6yDs3";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


document
  .getElementById("formularioRecuperacion")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const boton =
        document.getElementById(
          "botonRecuperacion"
        );


      const mensaje =
        document.getElementById(
          "mensaje"
        );


      boton.disabled = true;

      boton.textContent =
        "Enviando...";

      mensaje.style.display =
        "none";


      try {

        const { error } =
          await supabaseClient.auth
            .resetPasswordForEmail(
              email,
              {
                redirectTo:
                  "https://lisandsedita-art.github.io/aluconecta/nueva-password.html"
              }
            );


        if (error) {
          throw error;
        }


        mensaje.className =
          "mensaje exito";

        mensaje.style.display =
          "block";


        mensaje.innerHTML = `

          <strong>
            ¡Solicitud enviada!
          </strong>

          <p>
            Si el correo corresponde a una cuenta
            de AluConecta, recibirás un enlace
            para recuperar tu contraseña.
          </p>

          <p>
            Revisá también la carpeta de spam.
          </p>

        `;


        document
          .getElementById(
            "formularioRecuperacion"
          )
          .reset();


      } catch (error) {

        console.error(
          "Error al recuperar contraseña:",
          error
        );


        mensaje.className =
          "mensaje error";

        mensaje.style.display =
          "block";


        mensaje.innerHTML = `

          <strong>
            No pudimos procesar la solicitud.
          </strong>

          <p>
            ${error.message}
          </p>

          <p>
            Revisá el correo e intentá nuevamente.
          </p>

        `;

      } finally {

        boton.disabled = false;

        boton.textContent =
          "Enviar enlace de recuperación";

      }

    }
  );

</script>

</body>

</html>
