<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Perfil profesional - AluConecta</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }


    header {
      background: #1f2937;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }


    header h1 {
      margin: 0 0 10px;
    }


    header p {
      margin: 0;
    }


    .contenedor {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }


    .perfil {
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }


    .avatar {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
    }


    .nombre {
      text-align: center;
      margin: 0;
    }


    .ubicacion {
      text-align: center;
      color: #666;
      margin-top: 8px;
    }


    .rubro {
      text-align: center;
      font-weight: bold;
      margin-top: 10px;
    }


    .seccion {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }


    .seccion h2 {
      font-size: 20px;
      margin-top: 0;
    }


    .dato {
      line-height: 1.6;
      margin-bottom: 12px;
    }


    .botones {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 25px;
    }


    .boton {
      display: block;
      padding: 14px;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      color: white;
    }


    .whatsapp {
      background: #16a34a;
    }


    .llamar {
      background: #2563eb;
    }


    .instagram {
      background: #c13584;
    }


    .facebook {
      background: #1877f2;
    }


    .tiktok {
      background: #111827;
    }


    .web {
      background: #475569;
    }


    .volver {
      display: block;
      text-align: center;
      margin: 25px 0;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }


    .sin-datos {
      text-align: center;
      padding: 40px 20px;
    }


    .cargando {
      text-align: center;
      padding: 40px 20px;
    }


    .error {
      color: #991b1b;
    }


    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }

  </style>

</head>


<body>


  <header>

    <h1>
      AluConecta
    </h1>

    <p>
      Conectando personas con profesionales.
    </p>

  </header>



  <main class="contenedor">


    <section
      id="perfil"
      class="perfil">

      <div class="cargando">

        Cargando perfil...

      </div>

    </section>


    <a
      href="aluminio.html"
      class="volver">

      ← Volver a profesionales

    </a>


  </main>



  <footer>

    <p>
      © 2026 AluConecta
    </p>

    <p>
      Conectando personas, trabajos y oportunidades.
    </p>

  </footer>



  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>


    const SUPABASE_URL =
      "https://wroaxwjyjrxzwctfkyoo.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_35152HM4RtYst1yA2a79zA_zIh6yDs3";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    const perfil =
      document.getElementById("perfil");



    /*
      Obtenemos el ID del profesional
      desde la dirección de la página.

      Ejemplo:

      perfil.html?id=738fde39-444e-4117-b3d9-2c31e0647f66
    */

    const parametros =
      new URLSearchParams(
        window.location.search
      );


    const id =
      parametros.get("id");



    async function cargarPerfil() {


      /*
        Si no recibimos un ID,
        no sabemos qué perfil mostrar.
      */

      if (!id) {

        perfil.innerHTML = `

          <div class="sin-datos">

            <h2>
              Perfil no disponible
            </h2>

            <p>
              No se indicó qué perfil queremos mostrar.
            </p>

          </div>

        `;

        return;

      }



      try {


        /*
          Buscamos directamente en Supabase.

          Ya no dependemos de localStorage.
        */

        const {
          data,
          error
        } =
          await supabaseClient

            .from("perfiles")

            .select("*")

            .eq("id", id)

            .single();



        if (error) {

          throw error;

        }



        if (!data) {

          perfil.innerHTML = `

            <div class="sin-datos">

              <h2>
                Perfil no disponible
              </h2>

              <p>
                No encontramos este profesional.
              </p>

            </div>

          `;

          return;

        }



        /*
          DATOS DEL PERFIL
        */

        const profesional =
          data;



        /*
          Inicial del nombre.
        */

        const inicial =
          profesional.nombre
            ? profesional.nombre
                .charAt(0)
                .toUpperCase()
            : "A";



        /*
          Actividades.

          La tabla perfiles utiliza
          la columna "actividades".
        */

        const actividades =
          profesional.actividades || "Servicios profesionales";



        /*
          Teléfono.
        */

        const telefonoOriginal =
          profesional.telefono || "";



        /*
          Limpiamos el teléfono
          para WhatsApp.
        */

        let telefonoWhatsApp =
          telefonoOriginal
            .replace(/\D/g, "");



        /*
          Si tiene 10 dígitos,
          agregamos código de Argentina.
        */

        if (
          telefonoWhatsApp.length === 10
        ) {

          telefonoWhatsApp =
            "54" + telefonoWhatsApp;

        }



        const whatsapp =
          telefonoWhatsApp
            ? "https://wa.me/" + telefonoWhatsApp
            : "";



        /*
          Redes sociales.
        */

        const instagram =
          profesional.instagram || "";


        const facebook =
          profesional.facebook || "";


        const tiktok =
          profesional.tiktok || "";


        const web =
          profesional.web || "";



        /*
          MOSTRAMOS EL PERFIL
        */

        perfil.innerHTML = `


          <div class="avatar">

            ${inicial}

          </div>



          <h1 class="nombre">

            ${profesional.nombre || "Profesional"}

          </h1>



          <p class="ubicacion">

            📍 ${profesional.localidad || "Localidad no indicada"}

          </p>



          <p class="rubro">

            🏷️ ${actividades}

          </p>



          <div class="seccion">

            <h2>
              Servicios
            </h2>

            <p class="dato">

              ${profesional.servicios || "No especificados"}

            </p>

          </div>



          <div class="seccion">

            <h2>
              Sobre el profesional
            </h2>

            <p class="dato">

              ${profesional.descripcion || "Sin presentación"}

            </p>

          </div>



          <div class="seccion">

            <h2>
              Contacto
            </h2>


            <p class="dato">

              📱 ${telefonoOriginal || "No indicado"}

            </p>



            <div class="botones">


              ${
                whatsapp
                ? `

                  <a
                    href="${whatsapp}?text=${encodeURIComponent(
                      `Hola ${profesional.nombre || ""}, vi tu perfil en AluConecta y quisiera consultar por un trabajo.`
                    )}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="boton whatsapp">

                    💬 Contactar por WhatsApp

                  </a>

                `
                : ""
              }



              ${
                telefonoOriginal
                ? `

                  <a
                    href="tel:${telefonoOriginal}"
                    class="boton llamar">

                    📞 Llamar

                  </a>

                `
                : ""
              }


            </div>

          </div>



          <div class="seccion">

            <h2>
              Presencia profesional
            </h2>



            <div class="botones">


              ${
                instagram
                ? `

                  <a
                    href="https://www.instagram.com/${instagram.replace(/^@/, "")}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="boton instagram">

                    📸 Ver Instagram

                  </a>

                `
                : ""
              }



              ${
                facebook
                ? `

                  <a
                    href="https://www.facebook.com/${facebook.replace(/^@/, "")}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="boton facebook">

                    📘 Ver Facebook

                  </a>

                `
                : ""
              }



              ${
                tiktok
                ? `

                  <a
                    href="https://www.tiktok.com/@${tiktok.replace(/^@/, "")}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="boton tiktok">

                    🎵 Ver TikTok

                  </a>

                `
                : ""
              }



              ${
                web
                ? `

                  <a
                    href="${web.startsWith("http") ? web : "https://" + web}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="boton web">

                    🌐 Visitar sitio web

                  </a>

                `
                : ""
              }


            </div>

          </div>


        `;


      } catch (error) {


        console.error(
          "Error al cargar perfil:",
          error
        );


        perfil.innerHTML = `

          <div class="sin-datos error">

            <h2>
              No pudimos cargar el perfil
            </h2>

            <p>
              Ocurrió un problema al consultar los datos.
            </p>

          </div>

        `;

      }

    }



    cargarPerfil();


  </script>


</body>

</html>
