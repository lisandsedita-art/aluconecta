body{background:#f5f7fa;padding:16px;padding-bottom:90px}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
h2{color:#0F2E4D;margin-bottom:12px}

<body>
<h2>✏️ Editar mi perfil profesional</h2>

<div class="card">
<h3>Datos básicos</h3>
<input id="nombre" placeholder="Nombre / Empresa ej: Aluminio HS">
<input id="zona" placeholder="Zona ej: Capitán Bermúdez">
<input id="tel" placeholder="Teléfono">
<textarea id="bio" placeholder="Descripción de tu trabajo..."></textarea>
</div>

<div class="card">
<h3>🌐 Redes sociales y web (opcional)</h3>
<small>Si las completás, se muestran en tu perfil público. Podés poner solo las que quieras.</small>
<input id="wpp" placeholder="WhatsApp ej: 3411234567">
<input id="ig" placeholder="Instagram ej: https://instagram.com/aluminio_hs o @aluminio_hs">
<input id="fb" placeholder="Facebook ej: https://facebook.com/tu.pagina">
<input id="tk" placeholder="TikTok ej: @aluminio.hs">
<input id="yt" placeholder="YouTube link">
<input id="web" placeholder="Página web https://...">
<label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="mostrarRedes" checked style="width:auto"> Mostrar mis redes en perfil público</label>
</div>

<div class="card">
<h3>Verificación</h3>
<small>Subí foto de DNI o CUIT y 2 fotos de trabajos para que te verifiquemos (24hs)</small>
<input type="file" id="dni">
<input type="file" id="trab1">
<input type="file" id="trab2">
</div>

<button class="btn" onclick="guardar()">Guardar perfil</button>
<button class="btn btn-sec" onclick="location.href='perfil.html'">Ver mi perfil público</button>

<script>
proteger('profesional');
function guardar(){
  const datos = {
    nombre: document.getElementById('nombre').value,
    zona: document.getElementById('zona').value,
    tel: document.getElementById('tel').value,
    bio: document.getElementById('bio').value,
    redes: {
      wpp: document.getElementById('wpp').value,
      ig: document.getElementById('ig').value,
      fb: document.getElementById('fb').value,
      tk: document.getElementById('tk').value,
      yt: document.getElementById('yt').value,
      web: document.getElementById('web').value,
      mostrar: document.getElementById('mostrarRedes').checked
    },
    rol: 'profesional',
    verificado: false
  };
  localStorage.setItem('alu_user', JSON.stringify(datos));
  localStorage.setItem('alu_perfil_' + datos.nombre, JSON.stringify(datos));
  alert('Perfil guardado! Queda en revisión.');
  location.href='perfil.html';
}
</script>
